<section class="view" id="view-register"><div class="auth-wrap"><form class="auth-card" id="registerForm" novalidate><h2>Buat akun baru</h2><p class="small">Simpan catatan kulit dan rutinitasmu di satu tempat.</p><label class="form-field"><span>Nama panggilan</span><input class="input" type="text" name="name" placeholder="Nama kamu (huruf saja)" required minlength="2" maxlength="250" autocomplete="nickname" /><small class="field-err"></small></label><label class="form-field"><span>Jenis kelamin</span><select class="input" name="gender" required><option value="" disabled selected>Pilih jenis kelamin</option><option>Perempuan</option><option>Laki-laki</option></select><small class="field-err"></small></label><label class="form-field"><span>Tanggal lahir</span><input class="input" type="date" name="birthdate" min="1920-01-01" required /><small class="field-err"></small></label><label class="form-field"><span>Email</span><input class="input" type="email" name="email" placeholder="nama@email.com" required maxlength="254" autocomplete="email" /><small class="field-err"></small></label><label class="form-field"><span>Kata sandi</span><input class="input" type="password" name="password" placeholder="Min. 8 karakter, huruf dan angka" required minlength="8" autocomplete="new-password" /><small class="field-err"></small></label><label class="form-field"><span>Konfirmasi kata sandi</span><input class="input" type="password" name="confirm" placeholder="Ulangi kata sandi" required minlength="8" autocomplete="new-password" /><small class="field-err"></small></label><button class="btn btn-primary" style="width:100%" type="submit">Buat akun</button><p class="form-help">Sudah punya akun? <a href="#/login">Masuk</a></p></form></div></section>
